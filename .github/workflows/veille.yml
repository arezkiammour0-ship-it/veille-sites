# Surveillance externe des sites (remplace Kuma quand Hetzner s'arrête).
# Liste des sites : secret VEILLE_URLS (une ligne "nom|url"), rien de sensible dans le dépôt.
# Alerte Telegram uniquement au changement d'état (panne / rétabli).
name: veille

on:
  schedule:
    - cron: "*/30 * * * *"   # le cron GitHub est irrégulier : chaque run boucle ~5 h 50
    - cron: "17 6 1 * *"   # entretien mensuel : évite la mise en sommeil après 60 jours
  workflow_dispatch:

permissions:
  contents: write

concurrency: veille

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      - name: Etat precedent
        uses: actions/cache/restore@v4
        with:
          path: etat.txt
          key: etat-${{ github.run_id }}
          restore-keys: etat-

      - name: Controle
        env:
          VEILLE_URLS: ${{ secrets.VEILLE_URLS }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        # Boucle toutes les 5 min ; un seul run actif (concurrency), le suivant attend en file.
        run: |
          fin=$((SECONDS + 350*60))
          while [ $SECONDS -lt $fin ]; do bash veille.sh; sleep 300; done

      - name: Etat suivant
        if: always()
        uses: actions/cache/save@v4
        with:
          path: etat.txt
          key: etat-${{ github.run_id }}

      - name: Entretien mensuel
        if: github.event.schedule == '17 6 1 * *'
        run: |
          git config user.name veille
          git config user.email veille@users.noreply.github.com
          date -u > entretien.txt
          git add entretien.txt
          git commit -m "entretien mensuel"
          git push
